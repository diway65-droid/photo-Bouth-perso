<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Photobooth</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#faf7f2">
  <style>
    :root {
      --bg-cream: #faf7f2;
      --card-bg: #ffffff;
      --gold-primary: #d4a373;
      --gold-secondary: #faedcd;
      --gold-border: rgba(212, 163, 115, 0.45);
      --text-dark: #33272a;
      --text-muted: #7f6a70;
      --btn-grad: linear-gradient(135deg, #d4a373 0%, #bc6c25 100%);
      --btn-shadow: 0 8px 20px rgba(188, 108, 37, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-dark);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    /* Cadre neutre sans fleurs */
    .card {
      background: var(--card-bg);
      border-radius: 28px;
      padding: 42px 28px;
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 36px rgba(180, 140, 110, 0.12);
      border: 1px solid var(--gold-border);
      position: relative;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1.5px solid var(--gold-border);
      border-radius: 20px;
      pointer-events: none;
    }

    .gear-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #fdfaf6;
      border: 1px solid var(--gold-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      color: var(--gold-primary);
      z-index: 5;
    }

    .app-logo {
      width: 130px;
      height: 130px;
      margin: 0 auto 18px;
      display: block;
      filter: drop-shadow(0 6px 14px rgba(212, 163, 115, 0.2));
    }

    h1.event-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.1rem;
      font-weight: 700;
      color: var(--text-dark);
      line-height: 1.25;
      margin-bottom: 10px;
    }

    p.event-subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 32px;
      padding: 0 10px;
    }

    .btn-main {
      padding: 16px 28px;
      border-radius: 16px;
      border: none;
      font-size: 1.15rem;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: transform 0.1s, opacity 0.15s;
    }
    .btn-main:active {
      transform: scale(0.98);
    }

    .btn-photo {
      background: var(--btn-grad);
      color: #ffffff;
      box-shadow: var(--btn-shadow);
      width: 100%;
    }

    /* Écran Caméra & Aperçu */
    .view-fullscreen {
      display: none;
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .view-fullscreen.active {
      display: flex;
    }

    video#cameraFeed, #previewImage {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camera-topbar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      z-index: 120;
    }

    .icon-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.45);
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      color: white;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    /* Boîtier roulette de défis au-dessus de la caméra */
    .defi-box {
      position: absolute;
      top: 76px;
      left: 16px;
      right: 16px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 14px 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      z-index: 120;
      text-align: center;
      border: 1.5px solid var(--gold-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .defi-box.spinning {
      border-color: #bc6c25;
      animation: pulse 0.5s infinite alternate;
    }

    @keyframes pulse {
      from { box-shadow: 0 0 10px rgba(212, 163, 115, 0.4); }
      to { box-shadow: 0 0 20px rgba(188, 108, 37, 0.8); }
    }

    .defi-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-dark);
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.35;
    }

    .defi-actions {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
    }

    .btn-defi-action {
      padding: 8px 16px;
      border-radius: 12px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Déclencheur photo en bas */
    .camera-bottombar {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 120;
    }

    .shutter-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #ffffff;
      border: 6px solid rgba(255, 255, 255, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 30px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }
    .shutter-btn:active {
      transform: scale(0.92);
    }

    .countdown-overlay {
      position: absolute;
      font-size: 7.5rem;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
      z-index: 130;
      pointer-events: none;
    }

    .preview-bottombar {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 14px;
      padding: 0 20px;
      z-index: 120;
    }

    /* Modal Réglages */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(51, 39, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: #ffffff;
      border-radius: 24px;
      width: 100%;
      max-width: 440px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      border: 1px solid var(--gold-border);
      text-align: left;
    }

    .modal-box h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      margin-bottom: 18px;
      color: var(--text-dark);
    }

    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid #e7ded6;
      font-size: 0.95rem;
      outline: none;
      background: #faf8f5;
    }
    .form-group input:focus {
      border-color: var(--gold-primary);
      background: #ffffff;
    }
  </style>
</head>
<body>

  <!-- ACCUEIL -->
  <main class="card">
    <button class="gear-btn" id="openSettingsBtn" aria-label="Paramètres">⚙️</button>
    
    <img src="camera-360.png" alt="Logo Photobooth" class="app-logo">
    <h1 class="event-title" id="lblTitle">Photobooth</h1>
    <p class="event-subtitle" id="lblSubtitle">Laissez vos souvenirs photos de la soirée ! Installez-vous, souriez, et c'est parti !</p>

    <button class="btn-main btn-photo" id="btnOpenBooth">
      <span>📸</span> Prendre une photo
    </button>
  </main>

  <!-- ÉCRAN PRISE DE VUE (Caméra + Roulette de défis + Déclencheur) -->
  <section class="view-fullscreen" id="cameraView">
    <div class="camera-topbar">
      <button class="icon-btn" id="btnBackHome" title="Accueil">🏠</button>
      <button class="icon-btn" id="btnFlipCamera" title="Changer de caméra">🔄</button>
    </div>

    <!-- BOÎTE DU DÉFI AU-DESSUS DE L'IMAGE -->
    <div class="defi-box" id="defiBox">
      <div class="defi-text" id="defiText">Envie de pimenter la photo ?</div>
      <div class="defi-actions">
        <button class="btn-defi-action" id="btnSpinDefi" style="background: var(--gold-secondary); color: #8c4a00;">
          🎲 Lancer un défi
        </button>
        <button class="btn-defi-action" id="btnClearDefi" style="background: #f1f1f1; color: #666; display: none;">
          ✕ Sans défi
        </button>
      </div>
    </div>

    <div class="countdown-overlay" id="countdownOverlay"></div>
    <video id="cameraFeed" playsinline autoplay muted></video>

    <div class="camera-bottombar">
      <button class="shutter-btn" id="btnTriggerPhoto" title="Prendre la photo">📸</button>
    </div>
  </section>

  <!-- ÉCRAN APERÇU -->
  <section class="view-fullscreen" id="previewView">
    <img id="previewImage" alt="Photo capturée">
    <div class="preview-bottombar">
      <button class="btn-main" id="btnRetakePhoto" style="background: rgba(255,255,255,0.95); color: var(--text-dark); padding: 12px 22px;">
        🔄 Refaire
      </button>
      <button class="btn-main btn-photo" id="btnSavePhoto" style="padding: 12px 26px; width: auto;">
        ✅ Valider
      </button>
    </div>
  </section>

  <!-- MODAL DE RÉGLAGES -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-box">
      <h2>⚙️ Réglages de l'événement</h2>
      <div class="form-group">
        <label for="inputTitle">Nom de l'événement (affiché à l'accueil & sur le cadre) :</label>
        <input type="text" id="inputTitle" placeholder="Ex: Anniversaire, Mariage...">
      </div>
      <div class="form-group">
        <label for="inputSubtitle">Message / consigne d'accueil :</label>
        <input type="text" id="inputSubtitle" placeholder="Ex: Souriez et prenez la pose !">
      </div>
      <div style="display: flex; gap: 12px; margin-top: 24px;">
        <button class="btn-main" id="closeSettingsBtn" style="flex: 1; background: #eee; color: #444; font-size: 0.95rem; padding: 12px;">Annuler</button>
        <button class="btn-main btn-photo" id="saveSettingsBtn" style="flex: 1; font-size: 0.95rem; padding: 12px; width: auto;">Enregistrer</button>
      </div>
    </div>
  </div>

  <canvas id="renderCanvas" style="display: none;"></canvas>

  <script>
    // --- 1. Service Worker ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }

    // --- 2. Wake Lock (maintien de l'écran allumé sans interruption) ---
    let wakeLock = null;
    async function initWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
        } catch (e) {
          console.warn('WakeLock:', e);
        }
      }
    }
    document.addEventListener('DOMContentLoaded', initWakeLock);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') initWakeLock();
    });

    // --- 3. Titre et message paramétrables ---
    const defaultTitle = "Photobooth";
    const defaultSubtitle = "Laissez vos souvenirs photos de la soirée ! Installez-vous, souriez, et c'est parti !";

    const lblTitle = document.getElementById('lblTitle');
    const lblSubtitle = document.getElementById('lblSubtitle');
    const inputTitle = document.getElementById('inputTitle');
    const inputSubtitle = document.getElementById('inputSubtitle');

    function syncTexts() {
      const savedTitle = localStorage.getItem('pb_app_title') || defaultTitle;
      const savedSub = localStorage.getItem('pb_app_subtitle') || defaultSubtitle;
      lblTitle.textContent = savedTitle;
      lblSubtitle.textContent = savedSub;
      inputTitle.value = savedTitle;
      inputSubtitle.value = savedSub;
    }
    syncTexts();

    // Modal
    const settingsModal = document.getElementById('settingsModal');
    document.getElementById('openSettingsBtn').onclick = () => settingsModal.classList.add('active');
    document.getElementById('closeSettingsBtn').onclick = () => settingsModal.classList.remove('active');
    document.getElementById('saveSettingsBtn').onclick = () => {
      localStorage.setItem('pb_app_title', inputTitle.value.trim() || defaultTitle);
      localStorage.setItem('pb_app_subtitle', inputSubtitle.value.trim() || defaultSubtitle);
      syncTexts();
      settingsModal.classList.remove('active');
    };

    // --- 4. Défis & Animation roulette (défilement) ---
    const defiList = [
      "Faites la pose d'une statue grecque !",
      "Regardez tous intensément le plafond !",
      "Faites votre meilleure tête de coupable pris la main dans le sac !",
      "Pose façon groupe de rock en couverture d'album !",
      "Grimace générale sans cligner des yeux !",
      "Prenez la pose la plus chic et snob !",
      "Faites semblant d'être dans un ascenseur bondé !",
      "Vous venez de gagner au loto : explosion de joie !",
      "Tout le monde pointe la personne la plus drôle du groupe !"
    ];

    let hasActiveChallenge = false;
    let isSpinning = false;
    const defiBox = document.getElementById('defiBox');
    const defiText = document.getElementById('defiText');
    const btnSpinDefi = document.getElementById('btnSpinDefi');
    const btnClearDefi = document.getElementById('btnClearDefi');

    function runDefiRoulette() {
      if (isSpinning) return;
      isSpinning = true;
      defiBox.classList.add('spinning');
      btnClearDefi.style.display = 'none';

      let count = 0;
      const totalSteps = 24; // nombre de défis affichés avant arrêt
      let speed = 60; // vitesse initiale en ms

      function step() {
        const randomIndex = Math.floor(Math.random() * defiList.length);
        defiText.textContent = "🎲 " + defiList[randomIndex];
        count++;

        if (count < totalSteps) {
          // Ralentissement progressif pour effet roulette
          if (count > totalSteps - 8) speed += 45;
          setTimeout(step, speed);
        } else {
          // Arrêt final sur le défi
          isSpinning = false;
          hasActiveChallenge = true;
          defiBox.classList.remove('spinning');
          btnSpinDefi.textContent = "🔄 Relancer";
          btnClearDefi.style.display = 'inline-block';
        }
      }
      step();
    }

    function resetDefi() {
      if (isSpinning) return;
      hasActiveChallenge = false;
      defiText.textContent = "Envie de pimenter la photo ?";
      btnSpinDefi.textContent = "🎲 Lancer un défi";
      btnClearDefi.style.display = 'none';
    }

    btnSpinDefi.onclick = runDefiRoulette;
    btnClearDefi.onclick = resetDefi;

    // --- 5. Flux Caméra et Prise de Vue ---
    let currentFacingMode = 'user';
    let mediaStream = null;
    let lastBlob = null;
    let isCountingDown = false;

    const cameraView = document.getElementById('cameraView');
    const previewView = document.getElementById('previewView');
    const video = document.getElementById('cameraFeed');
    const countdownOverlay = document.getElementById('countdownOverlay');
    const previewImage = document.getElementById('previewImage');
    const btnTriggerPhoto = document.getElementById('btnTriggerPhoto');

    async function openCamera() {
      try {
        if (mediaStream) {
          mediaStream.getTracks().forEach(t => t.stop());
        }
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: currentFacingMode,
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });
        video.srcObject = mediaStream;
        cameraView.classList.add('active');
        btnTriggerPhoto.style.pointerEvents = 'auto';
      } catch (err) {
        alert("Impossible d'accéder à la caméra. Vérifiez les autorisations.");
      }
    }

    function closeCamera() {
      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
        mediaStream = null;
      }
      cameraView.classList.remove('active');
      resetDefi();
    }

    document.getElementById('btnOpenBooth').onclick = openCamera;
    document.getElementById('btnBackHome').onclick = closeCamera;

    document.getElementById('btnFlipCamera').onclick = () => {
      currentFacingMode = (currentFacingMode === 'user') ? 'environment' : 'user';
      openCamera();
    };

    // Déclencheur avec compte à rebours
    btnTriggerPhoto.onclick = () => {
      if (isCountingDown || isSpinning) return;
      isCountingDown = true;
      btnTriggerPhoto.style.pointerEvents = 'none';

      let timer = 3;
      countdownOverlay.textContent = timer;
      const step = setInterval(() => {
        timer--;
        if (timer > 0) {
          countdownOverlay.textContent = timer;
        } else {
          clearInterval(step);
          countdownOverlay.textContent = '';
          isCountingDown = false;
          snapPhoto();
        }
      }, 1000);
    };

    function snapPhoto() {
      const canvas = document.getElementById('renderCanvas');
      const ctx = canvas.getContext('2d');
      const w = video.videoWidth || 1920;
      const h = video.videoHeight || 1080;

      canvas.width = w;
      canvas.height = h;

      // Effet miroir si caméra frontale
      if (currentFacingMode === 'user') {
        ctx.translate(w, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, w, h);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
      } else {
        ctx.drawImage(video, 0, 0, w, h);
      }

      // Incrustation du liseré et du titre UNIQUEMENT s'il n'y a PAS de défi actif
      if (!hasActiveChallenge) {
        const title = localStorage.getItem('pb_app_title') || "";

        // Double liseré fin couleur champagne/or doux
        const marginOuter = Math.round(w * 0.015);
        const marginInner = Math.round(w * 0.022);

        ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
        ctx.lineWidth = 4;
        ctx.strokeRect(marginOuter, marginOuter, w - (marginOuter * 2), h - (marginOuter * 2));

        ctx.strokeStyle = "rgba(212, 163, 115, 0.75)";
        ctx.lineWidth = 2;
        ctx.strokeRect(marginInner, marginInner, w - (marginInner * 2), h - (marginInner * 2));

        // Cartouche bandeau avec le titre personnalisé
        if (title) {
          const badgeH = Math.round(h * 0.075);
          const badgeW = Math.round(w * 0.65);
          const badgeX = (w - badgeW) / 2;
          const badgeY = h - badgeH - Math.round(h * 0.04);

          ctx.fillStyle = "rgba(255, 255, 255, 0.92)";
          ctx.beginPath();
          ctx.roundRect(badgeX, badgeY, badgeW, badgeH, 16);
          ctx.fill();

          ctx.strokeStyle = "rgba(212, 163, 115, 0.6)";
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.fillStyle = "#33272a";
          ctx.font = `600 ${Math.round(badgeH * 0.42)}px 'Playfair Display', serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(title, w / 2, badgeY + (badgeH / 2));
        }
      }

      closeCamera();

      canvas.toBlob((blob) => {
        lastBlob = blob;
        previewImage.src = URL.createObjectURL(blob);
        previewView.classList.add('active');
      }, 'image/jpeg', 0.95);
    }

    // Boutons de prévisualisation
    document.getElementById('btnRetakePhoto').onclick = () => {
      previewView.classList.remove('active');
      openCamera();
    };

    document.getElementById('btnSavePhoto').onclick = () => {
      if (lastBlob) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(lastBlob);
        a.download = `photo_${Date.now()}.jpg`;
        a.click();
      }
      previewView.classList.remove('active');
    };
  </script>
</body>
</html>
